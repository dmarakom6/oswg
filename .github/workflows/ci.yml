name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src/ tests/

      - name: Pytest (unit)
        run: pytest -q -m "not e2e"

  ui:
    name: UI (svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python deps (incl. playwright)
        run: pip install -e '.[dev,js]'

      - name: Install UI deps + build static
        run: |
          cd ui && npm ci && npm run build
          cd .. && rm -rf src/oswg/static && cp -r ui/build src/oswg/static

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Pytest (e2e)
        run: pytest -q -m e2e