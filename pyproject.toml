[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oswg"
version = "0.2.2"
description = "Oddly Specific Wordlist Generator - Generate targeted wordlists from website content"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dimitris Marakomichelakis" },
]
keywords = [
    "security",
    "pentesting",
    "wordlist",
    "scraper",
    "cybersecurity",
    "osint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "aiosqlite>=0.19.0",
    "websockets>=12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
oswg = "oswg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oswg"]
force-include = { "src/oswg/static" = "oswg/static" }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.semantic_release]
version_variables = [
    "src/oswg/__init__.py:__version__",
]
version_toml = [
    "pyproject.toml:project.version",
]
branch = "master"
commit_message = "chore(release): {version}"
commit_version_number = true
tag_format = "v{version}"
upload_to_release = false
allow_zero_version = true
major_on_zero = false
