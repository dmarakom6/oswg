name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.1)"
        required: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            artifact_name: oswg-linux-x86_64
            binary_name: oswg
          - os: macos-latest
            target: macos-x86_64
            artifact_name: oswg-macos-x86_64
            binary_name: oswg
          - os: macos-latest
            target: macos-arm64
            artifact_name: oswg-macos-arm64
            binary_name: oswg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          python build_binary.py frontend
          pip install .
          python build_binary.py binary

      - name: Rename binary for platform
        run: mv dist/oswg-bin dist/${{ matrix.artifact_name }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend into package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python build_binary.py frontend

      - name: Build sdist and wheel
        run: |
          python -m build --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
          password: ${{ secrets.PYPI_API_KEY }}
          packages-dir: dist/
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    if: success() || failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        run: |
          cd artifacts
          for dir in oswg-linux-x86_64 oswg-macos-x86_64 oswg-macos-arm64; do
            zip -r "${dir}.zip" "${dir}/"
          done
          cd ..

      - name: List packaged artifacts
        run: ls -la artifacts/*.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/oswg-linux-x86_64.zip
            artifacts/oswg-macos-x86_64.zip
            artifacts/oswg-macos-arm64.zip
          generate_release_notes: false
          draft: false
          prerelease: false
